<!doctype html>
<html lang="en" data-official-live="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="../assets/images/tomato.png" type="image/png">
  <title>Contact | Calvin Van</title>
  <meta name="description" content="Contact Calvin Van.">
  <script src="../lib/staging/staging.js"></script>
  <link rel="stylesheet" href="../style/local-asset-fonts.css">
  <link rel="stylesheet" href="../style/main.css">
  <link rel="stylesheet" href="../lib/layout/layout.css">
  <link rel="stylesheet" href="../lib/staging/staging.css">
</head>
<body>
  <main class="portfolio column-layout column-layout--contact" style="--columns-laptop: 4">
    <div class="column-slot column-slot--spacer" aria-hidden="true"></div>
    <div class="column-slot column-slot--contact">
      <section class="contact-block" aria-label="Contact">
        <div class="project-page-header"></div>
        <p class="contact-line"><button type="button" class="contact-email-copy" data-email="calvinvan58@gmail.com" aria-label="Copy email address">calvinvan58@gmail.com</button></p>
        <p class="contact-line"><a href="https://www.instagram.com/calvinpony/" target="_blank" rel="noopener noreferrer">calvinpony</a></p>
      </section>
    </div>
    <div class="column-slot column-slot--spacer" aria-hidden="true"></div>
    <div class="column-slot column-slot--spacer" aria-hidden="true"></div>
  </main>
  <script type="module">
    import { mountProjectBackButton, mountProjectPageHeader } from "../js/web-dev-base/project-page.js";
    mountProjectBackButton();
  </script>
  <script>
    (function () {
      var btn = document.querySelector(".contact-email-copy");
      if (!btn) return;
      var email = btn.getAttribute("data-email") || btn.textContent.trim();
      function showCursorNotification(message, x, y) {
        var el = document.createElement("div");
        el.className = "copy-cursor-toast";
        el.textContent = message;
        el.style.left = x + "px";
        el.style.top = y + "px";
        document.body.appendChild(el);
        window.requestAnimationFrame(function () {
          el.classList.add("is-visible");
        });
        window.setTimeout(function () {
          el.classList.remove("is-visible");
          window.setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 180);
        }, 1200);
      }
      function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        return new Promise(function (resolve, reject) {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
            resolve();
          } catch (e) {
            reject(e);
          } finally {
            document.body.removeChild(ta);
          }
        });
      }
      btn.addEventListener("click", function (event) {
        copyToClipboard(email).then(function () {
          showCursorNotification("Copied", event.clientX + 12, event.clientY - 12);
        }).catch(function () {});
      });
    })();
  </script>
</body>
</html>
