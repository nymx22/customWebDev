<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farewell, Mr. Fuji | Calvin Van</title>
  <meta name="description" content="Farewell, Mr. Fuji — Calvin Van photography project.">
  <script src="../lib/staging/staging.js"></script>
  <link rel="stylesheet" href="../style/main.css">
  <link rel="stylesheet" href="../style/gallery/draggable-gallery.css">
  <link rel="stylesheet" href="../lib/staging/staging.css">
</head>
<body>
  <main class="portfolio">
    <section class="projects project-page">
      <h1 class="project-page-title">Farewell, Mr. Fuji</h1>
      <div id="farewell-drag-gallery" class="project-drag-gallery"></div>
    </section>
  </main>
  <script type="module">
    import { createDraggableGallery } from "../js/lib/draggable-gallery.js";

    const FUJI = "../assets/images/Farewell, Mr. Fuji/";
    const fujiSrc = (file) => FUJI + encodeURIComponent(file);

    const gallery = createDraggableGallery(document.getElementById("farewell-drag-gallery"));

    gallery.setImages([
      "Farewell, Mr. Fuji Scan 1.jpg",
      "Farewell, Mr. Fuji Scan 2.jpg",
      "Farewell, Mr. Fuji Scan 3.jpg",
      "Farewell, Mr. Fuji Scan 4.jpg",
      "Farewell, Mr. Fuji Scan 5.jpg",
      "Farewell, Mr. Fuji Scan 6.jpg",
    ].map((name) => ({ src: fujiSrc(name), alt: "" })));

    /* Image API: gallery.setImages([…]), gallery.addImages([…]), gallery.clear() */
  </script>
</body>
</html>
