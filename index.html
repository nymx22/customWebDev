<!doctype html>
<html lang="en">
<head>

  <script src="lib/staging/staging.js"></script>
  <link rel="stylesheet" href="style/main.css">
  <link rel="stylesheet" href="lib/layout/layout.css">

<body>
  <!-- Column slots: grid layout with ?staging=1 or saved customdev_staging (see lib/staging/staging.js). Live = stacked projects then name. -->

    <!-- row 1 -->
    <div class="column-slot column-slot--spacer" aria-hidden="true"></div>
    <div class="column-slot column-slot--projects">
      <section class="projects">
        <div class="project-list">
          <p class="project">A Missing Tile</p>
          <p class="project">Hokkaido Case</p>
          <p class="project">Silver Hair Song</p>
          <p class="project">Delicious</p>
          <p class="project"><a class="project-link" href="pages/farewell-mr-fuji.html">Farewell, Mr. Fuji</a></p>
        </div>
      </section>
    </div>
    <div class="column-slot column-slot--spacer" aria-hidden="true"></div>
    <div class="column-slot column-slot--spacer" aria-hidden="true"></div>
    <!-- row 2 -->
    <div class="column-slot column-slot--spacer" aria-hidden="true"></div>
    <div class="column-slot column-slot--name">
      <p class="photographer">calvin van</p>
    </div>
    <div class="column-slot column-slot--spacer" aria-hidden="true"></div>
    <div class="column-slot column-slot--spacer" aria-hidden="true"></div>
  </main>
  <a class="contact-link" href="pages/contact.html">Contact</a>

</html>
