<!doctype html>
<html data-official-live="true" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/images/tomato.png" type="image/png">
  <title>Office Tomato</title>
  <meta name="description" content="">
  <script src="lib/staging/staging.js"></script>
  <script src="lib/staging/site-structure-pages.js"></script>
  <link rel="stylesheet" href="style/local-asset-fonts.css">
  <link rel="stylesheet" href="style/main.css">
  <link rel="stylesheet" href="lib/layout/layout.css">
  <link rel="stylesheet" href="style/frame/site-frame.css">
  <link rel="stylesheet" href="lib/staging/staging.css">
</head>
<body class="page-home">
  <!-- Column slots: two-row grid (lib/layout/layout.css). Cell bodies load from SQLite `frame` / `frame_cell` (site-frame.js + staging-gui-settings.js in staging). Official: `data-official-live="true"` or `1` on <html> — no staging.js UI. -->
  <main
    class="portfolio column-layout column-layout--rows-2 page-home-main"
    data-site-frame-page="index"
  >
    <!-- row 1: frame cell indices 0–3 (row-major) -->
    <div class="column-slot column-slot--spacer" aria-hidden="true">
      <div class="site-frame__cell-mount" data-frame-cell-index="0"></div>
    </div>
    <div class="column-slot column-slot--projects">
      <div class="site-frame__cell-mount" data-frame-cell-index="1"></div>
    </div>
    <div class="column-slot column-slot--spacer" aria-hidden="true">
      <div class="site-frame__cell-mount" data-frame-cell-index="2"></div>
    </div>
    <div class="column-slot column-slot--spacer" aria-hidden="true">
      <div class="site-frame__cell-mount" data-frame-cell-index="3"></div>
    </div>
    <!-- row 2: indices 4–7 -->
    <div class="column-slot column-slot--spacer" aria-hidden="true">
      <div class="site-frame__cell-mount" data-frame-cell-index="4"></div>
    </div>
    <div class="column-slot column-slot--name">
      <div class="site-frame__cell-mount" data-frame-cell-index="5"></div>
    </div>
    <div class="column-slot column-slot--spacer" aria-hidden="true">
      <div class="site-frame__cell-mount" data-frame-cell-index="6"></div>
    </div>
    <div class="column-slot column-slot--spacer" aria-hidden="true">
      <div class="site-frame__cell-mount" data-frame-cell-index="7"></div>
    </div>
  </main>

  <script type="module">
    import { mountSiteFramePage } from "./js/web-dev-base/site-frame.js";
    mountSiteFramePage({ pageName: "index", rootSelector: "main.page-home-main" });
  </script>
</body>
</html>
