name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  layout-and-placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap local DB from data/layout (not in git)
        run: npm run setup:layout

      - name: Placement unit tests
        run: npm test

      - name: Baked layout import/export parity
        run: npm run test:layout-parity
